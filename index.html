<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCarts - Advanced Tailwind</title>
    <link href="./src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header Section -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center gap-2 text-2xl font-bold text-indigo-600">
                <i class="fa-solid fa-paw"></i> PetCarts
            </div>

            <!-- Search Bar (trim() function பயன்படுத்த இங்கே தான் Input வாங்குவோம்) -->
            <div class="relative w-full md:w-1/3">
                <input type="text" id="searchInput" placeholder="Search by breed name..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-gray-400"></i>
            </div>

            <!-- Filter Buttons -->
            <div class="flex gap-2 text-sm font-medium">
                <button onclick="filterCategory('all')" class="category-btn bg-indigo-600 text-white px-4 py-2 rounded-full transition hover:bg-indigo-700">All</button>
                <button onclick="filterCategory('small')" class="category-btn bg-white text-gray-600 px-4 py-2 rounded-full border border-gray-300 transition hover:bg-gray-100">Small</button>
                <button onclick="filterCategory('large')" class="category-btn bg-white text-gray-600 px-4 py-2 rounded-full border border-gray-300 transition hover:bg-gray-100">Large</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Product Grid -->
        <div id="petGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Cards will be injected here via JavaScript -->
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // Data (Array of Objects)
        const pets = [
            { id: 1, breed: "Golden Retriever", desc: "Friendly and active dog.", price: "$500", rating: 5, category: "large", img: "https://images.unsplash.com/photo-1552053831-71594a27632d?q=80&w=600&auto=format&fit=crop", available: true },
            { id: 2, breed: "Pomeranian", desc: "Small, fluffy and energetic.", price: "$300", rating: 4, category: "small", img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?q=80&w=600&auto=format&fit=crop", available: true },
            { id: 3, breed: "German Shepherd", desc: "Intelligent and loyal.", price: "$700", rating: 5, category: "large", img: "https://images.unsplash.com/photo-1589941013453-ec89f33b5e95?q=80&w=600&auto=format&fit=crop", available: false },
            { id: 4, breed: "Chihuahua", desc: "Tiny but full of personality.", price: "$200", rating: 4, category: "small", img: "https://images.unsplash.com/photo-1605568427561-40dd23c2acea?q=80&w=600&auto=format&fit=crop", available: true },
            { id: 5, breed: "Labrador", desc: "Friendly and outgoing.", price: "$450", rating: 5, category: "large", img: "https://images.unsplash.com/photo-1591769225440-811ad7d6eab3?q=80&w=600&auto=format&fit=crop", available: true },
            { id: 6, breed: "Pug", desc: "Charming and mischievous.", price: "$350", rating: 3, category: "small", img: "https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=600&auto=format&fit=crop", available: true },
        ];

        const petGrid = document.getElementById('petGrid');
        const searchInput = document.getElementById('searchInput');
        let currentCategory = 'all';

        // Function to generate star ratings
        function generateStars(rating) {
            let stars = '';
            for (let i = 0; i < 5; i++) {
                if (i < rating) stars += '<i class="fa-solid fa-star text-yellow-400 text-sm"></i>';
                else stars += '<i class="fa-regular fa-star text-gray-300 text-sm"></i>';
            }
            return stars;
        }

        // Function to render cards
        function renderPets(filteredPets) {
            petGrid.innerHTML = '';
            
            if (filteredPets.length === 0) {
                petGrid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">No pets found matching your criteria.</p>';
                return;
            }

            filteredPets.forEach(pet => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden group hover:shadow-xl transition-all duration-300 relative";
                
                card.innerHTML = `
                    <!-- Favorite Icon (Hover Effect) -->
                    <button class="absolute top-3 right-3 bg-white/80 backdrop-blur-sm w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 transition z-10">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                    <!-- Image with Zoom Hover -->
                    <div class="h-48 overflow-hidden relative">
                        <img src="${pet.img}" alt="${pet.breed}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        ${!pet.available ? '<div class="absolute inset-0 bg-black/50 flex items-center justify-center"><span class="bg-red-500 text-white px-3 py-1 rounded-full text-sm font-bold">Adopted</span></div>' : ''}
                    </div>

                    <!-- Content -->
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="text-lg font-bold text-gray-800">${pet.breed}</h3>
                            <span class="font-semibold text-indigo-600">${pet.price}</span>
                        </div>
                        <p class="text-gray-500 text-sm mb-3">${pet.desc}</p>
                        
                        <div class="flex items-center gap-1 mb-4">
                            ${generateStars(pet.rating)}
                            <span class="text-xs text-gray-400 ml-1">(${pet.rating}.0)</span>
                        </div>

                        <button class="w-full py-2 rounded-lg font-semibold transition ${pet.available ? 'bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white' : 'bg-gray-200 text-gray-500 cursor-not-allowed'}" ${!pet.available ? 'disabled' : ''}>
                            ${pet.available ? '<i class="fa-solid fa-check mr-1"></i> Select Pet' : 'Not Available'}
                        </button>
                    </div>
                `;
                petGrid.appendChild(card);
            });
        }

        // Initial Render
        renderPets(pets);

        // Search & Filter Logic
        function updateUI() {
            // trim() Function usage & toLowerCase for case-insensitive search
            const searchText = searchInput.value.trim().toLowerCase(); 
            
            const filtered = pets.filter(pet => {
                const matchesSearch = pet.breed.toLowerCase().includes(searchText);
                const matchesCategory = currentCategory === 'all' || pet.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            renderPets(filtered);
        }

        // Search Input Event Listener
        searchInput.addEventListener('input', updateUI);

        // Category Filter Logic
        function filterCategory(category) {
            currentCategory = category;
            
            // Update active button style
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-300');
            });
            
            // Add active style to clicked button
            const clickedBtn = Array.from(document.querySelectorAll('.category-btn')).find(btn => btn.textContent.toLowerCase() === category);
            if(clickedBtn) {
                clickedBtn.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-300');
                clickedBtn.classList.add('bg-indigo-600', 'text-white');
            }

            updateUI();
        }
    </script>
</body>
</html>
